name: TerraShift AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-quality:
    name: Next.js 16 Typecheck, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  ml-quality:
    name: PyTorch Siamese U-Net & FastAPI Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ml/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest tests -v
        env:
          PYTHONPATH: .
